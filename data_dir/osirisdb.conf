# =====================================================================
# OsirisDB Configuration File (osirisdb.conf)
# =====================================================================

# ---------------------------------------------------------------------
# MEMORY & BUFFER POOL
# ---------------------------------------------------------------------
# Total memory dedicated to shared page cache (e.g. 64MB, 128MB, 1GB)
# If 0 or omitted, dynamic auto-detection from system RAM is used.
shared_buffers = 128MB

# WAL memory double-buffer capacity (e.g. 64kB, 16MB)
wal_buffers = 16MB

# ---------------------------------------------------------------------
# CHECKPOINTS
# ---------------------------------------------------------------------
# Maximum time between automatic checkpoints (e.g. 300s, 5min)
checkpoint_timeout = 300s

# Fraction of checkpoint_timeout over which dirty page flushes are spread (0.0 - 1.0)
checkpoint_completion_target = 0.9

# ---------------------------------------------------------------------
# BACKGROUND WRITER
# ---------------------------------------------------------------------
# Sleep time between rounds of bgwriter flushing dirty pages (e.g. 200ms)
bgwriter_delay = 200ms

# Maximum pages bgwriter will write in a single round
bgwriter_lru_maxpages = 100

# ---------------------------------------------------------------------
# AUTOVACUUM
# ---------------------------------------------------------------------
# Whether autovacuum background worker is enabled (on/off, true/false)
autovacuum = on

# Sleep time between autovacuum runs (e.g. 60s, 1min)
autovacuum_naptime = 60s

# Minimum number of dead tuples required before triggering vacuum
autovacuum_vacuum_threshold = 50

# Percentage of table size added to threshold (e.g. 0.2 = 20%)
autovacuum_vacuum_scale_factor = 0.2

# Cost limit per round to throttle autovacuum I/O
autovacuum_cost_limit = 200