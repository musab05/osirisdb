[package]
name = "osirisdb"
version = "0.4.0"
edition = "2024"
authors = ["Musab Khan <musab05ahs@gmail.com>"]
description = "A SQL database engine implemented in Rust, featuring a custom parser, binder, query planner, optimizer, catalog, and storage engine. (Currently under active development)"
license = "Apache-2.0"
repository = "https://github.com/musab05/osirisdb"
homepage = "https://github.com/musab05/osirisdb"
documentation = "https://docs.rs/osirisdb"
readme = "README.md"
keywords = ["sql", "parser", "lexer", "ast", "database"]
categories = ["parser-implementations", "database"]
rust-version = "1.85"

[dependencies]

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
name = "catalog_bench"
path = "benches/catalog/database_bench.rs"
harness = false

[[bench]]
name = "lexer_bench"
path = "benches/lexer/database_bench.rs"
harness = false

[[bench]]
name = "parser_bench"
path = "benches/parser/database_bench.rs"
harness = false

[[bench]]
name = "binder_bench"
path = "benches/binder/database_bench.rs"
harness = false

[[bench]]
name = "executor_bench"
path = "benches/executor/database_bench.rs"
harness = false

[[bench]]
name = "storage_bench"
path = "benches/storage/database_bench.rs"
harness = false